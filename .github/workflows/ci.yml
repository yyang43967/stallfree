name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, CPU tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.6"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Tokenizer files only (no weights) for the chat-template tests, keyed by the pinned revision.
      - name: Cache Qwen3 tokenizer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub/models--Qwen--Qwen3-0.6B
          key: hf-qwen3-0.6b-tokenizer-c1899de289a04d12100db370d81485cdf75e47ca

      # torch resolves from the PyTorch CPU index on Linux (pyproject.toml), so no CUDA wheels.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Tests (CPU only)
        run: uv run pytest -m "not gpu"
