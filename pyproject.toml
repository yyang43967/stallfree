[project]
name = "stallfree"
version = "0.1.0"
description = "An online LLM serving engine with paged KV cache and stall-free mixed batching"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.10.0",
    "transformers==5.23.0",
    "safetensors",
    "fastapi>=0.163.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "modal==1.6.4",
    "mypy",
    "openai>=3.53.0",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stallfree"]

# CI and Linux development use CPU-only torch wheels. GPU images install the CUDA build
# separately (Phase 1b).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# CUDA-only and installed in the GPU image only; imported lazily by the flash backend.
[[tool.mypy.overrides]]
module = ["flash_attn", "flash_attn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
markers = [
    "gpu: needs a CUDA GPU; runs on Modal only",
]
addopts = "-ra --strict-markers"
